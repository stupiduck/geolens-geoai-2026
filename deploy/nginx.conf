limit_req_zone $binary_remote_addr zone=geolens_queries:1m rate=10r/m;
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 16k;
  limit_req_status 429;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  error_page 429 = @rate_limited;
  location @rate_limited { default_type application/json; return 429 '{"detail":{"code":"rate_limit","message":"Please wait before starting another analysis."}}'; }
  location ~ ^/(v1/recommend|v1/analyses|ask)$ { limit_req zone=geolens_queries burst=10 nodelay; proxy_pass http://api:8000; proxy_read_timeout 155s; proxy_buffering off; }

  location /v1/ { proxy_pass http://api:8000; proxy_buffering off; proxy_read_timeout 155s; }
  location /ask { proxy_pass http://api:8000; proxy_read_timeout 155s; }
  location /healthz { proxy_pass http://api:8000; }
  location /readyz { proxy_pass http://api:8000; }
  location /version { proxy_pass http://api:8000; }
  location /docs { proxy_pass http://api:8000; }
  location /openapi.json { proxy_pass http://api:8000; }
  location / { try_files $uri $uri/ /index.html; }
}
