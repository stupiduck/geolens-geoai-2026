server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 16k;
  location /v1/ { proxy_pass http://api:8000; proxy_buffering off; proxy_read_timeout 85s; }
  location /ask { proxy_pass http://api:8000; proxy_read_timeout 85s; }
  location /healthz { proxy_pass http://api:8000; }
  location /readyz { proxy_pass http://api:8000; }
  location /version { proxy_pass http://api:8000; }
  location /docs { proxy_pass http://api:8000; }
  location /openapi.json { proxy_pass http://api:8000; }
  location / { try_files $uri $uri/ /index.html; }
}
