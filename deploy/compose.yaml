name: geolens
services:
  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    environment:
      GEOLENS_MODEL_URL: http://model:8081
      GEOLENS_PUBLIC_ORIGIN: ${GEOLENS_PUBLIC_ORIGIN:-http://localhost:8080}
      GEOLENS_USER_AGENT: ${GEOLENS_USER_AGENT:-GeoLens/0.1 educational prototype}
    volumes:
      - geolens-data:/app/data
    ports:
      - "127.0.0.1:${GEOLENS_API_PORT:-8000}:8000"
    cpus: 0.5
    mem_limit: 640m
    restart: unless-stopped
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
  model:
    image: ${GEOLENS_LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    command: ["-m","/models/Qwen3.5-2B-Q4_K_M.gguf","--host","0.0.0.0","--port","8081","-t","2","-tb","2","-c","4096","-np","1","-b","128","-ub","64","--jinja","--chat-template-kwargs","{\"enable_thinking\":false}","--no-webui"]
    volumes:
      - ../models:/models:ro
    cpus: 1.5
    mem_limit: 2300m
    restart: unless-stopped
    expose: ["8081"]
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    ports:
      - "127.0.0.1:${GEOLENS_WEB_PORT:-8080}:80"
    cpus: 0.1
    mem_limit: 96m
    restart: unless-stopped
volumes:
  geolens-data:
